[package]
name = "tx"
version = "0.1.0"
edition = "2024"

[dependencies]
base64-simd = "0.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
imagesize = "0.15.0"
infer = "0.22.0"
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6.1"
notify = "8.2.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.5", features = ["event", "fs", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tar = "0.4.46"
toml = "1.1.6"
trash = "5.2.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.16.2"

# Dependencies are optimised even in debug builds: unoptimised decoders take seconds a picture.
[profile.dev.package."*"]
opt-level = 3

# Smallest binary for distribution: cargo build --profile dist
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# Except the picture code, which runs 20-200% slower when optimised for size.
[profile.dist.package.image]
opt-level = 3
[profile.dist.package.zune-jpeg]
opt-level = 3
[profile.dist.package.jpeg-decoder]
opt-level = 3
[profile.dist.package.png]
opt-level = 3
[profile.dist.package.fdeflate]
opt-level = 3
[profile.dist.package.miniz_oxide]
opt-level = 3
[profile.dist.package.base64-simd]
opt-level = 3
[profile.dist.package.ratatui-image]
opt-level = 3
